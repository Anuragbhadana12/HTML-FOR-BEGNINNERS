<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      width: 300px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h2 {
      margin: 15px 0 5px;
      font-size: 22px;
      color: #333;
    }

    .card p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }

    .card .details {
      padding: 15px;
    }

    .card .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .card .btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/300x180" alt="Student Photo">
    <div class="details">
      <h2>Anurag Sharma</h2>
      <p>🎓 Computer Science Student</p>
      <p>📍 Ghaziabad, India</p>
      <p>✉️ anurag@example.com</p>
      <a href="mailto:anurag@example.com" class="btn">Contact</a>
    </div>
  </div>
</body>
</html>
